<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-card">
        <h2>Temperature Converter</h2>
        <p class="subtitle">Enter a value, select the unit, and click convert.</p>
        
        <div class="input-group">
            <label for="degrees">Degrees</label>
            <input type="number" id="degrees" placeholder="Enter temperature" step="any">
        </div>

        <div class="input-group">
            <label for="unit">Type</label>
            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <button id="convert-btn">Convert</button>

        <div id="error-msg" class="error-msg hidden"></div>

        <div class="results-container">
            <h3>Converted Values:</h3>
            <div class="result-box">
                <span class="label">Celsius:</span>
                <span id="result-celsius" class="value">--</span>
            </div>
            <div class="result-box">
                <span class="label">Fahrenheit:</span>
                <span id="result-fahrenheit" class="value">--</span>
            </div>
            <div class="result-box">
                <span class="label">Kelvin:</span>
                <span id="result-kelvin" class="value">--</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
